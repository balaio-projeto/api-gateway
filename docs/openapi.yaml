          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: usuario
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UsuarioAutenticado'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlteracaoEstado'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseMediacaoResponse'
      security:
        - bearer-jwt: []
  /api/v1/admin/videos:
    get:
      tags:
        - Moderação de vídeos
      summary: Vídeos para moderação (paginado)
      description: >-
        Somente administrador. `estado=todos` (padrão) traz publicados e suspensos; `publicada` traz só os visíveis ao
        público (mais recentes primeiro); `suspensa` traz só os suspensos (suspensões mais recentes primeiro).
      operationId: listarParaModeracao
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              - todos
              - publicada
              - suspensa
            default: todos
        - name: pagina
          in: query
          required: false
          description: Página a partir de 0.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: tamanho
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListVideoModeracaoResponse'
        '400':
          description: '`REQUISICAO_INVALIDA` — estado desconhecido ou paginação fora da faixa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
      security:
        - bearer-jwt: []
  /api/v1/admin/videos/{id}/suspensao:
    post:
      tags:
        - Moderação de vídeos
      summary: Suspende o vídeo com motivo e avisa o artesão dono
      description: >-
        Somente administrador. O vídeo sai do público (continua visível ao dono, com `suspensao` preenchida) e o
        artesão recebe uma notificação na conta; falha ao notificar não desfaz a suspensão.
      operationId: suspender
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspensaoVideoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVideoModeracaoResponse'
        '400':
          description: '`REQUISICAO_INVALIDA` — motivo ausente ou fora de 10 a 1000 caracteres.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: '`VIDEO_NAO_ENCONTRADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '409':
          description: '`VIDEO_JA_SUSPENSO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
  /api/v1/admin/videos/{id}/reativacao:
    post:
      tags:
        - Moderação de vídeos
      summary: Reativa um vídeo suspenso e avisa o artesão dono
      description: >-
        Somente administrador. Sem corpo. O vídeo volta à situação que tinha (publicado ou rascunho) e o artesão
        recebe uma notificação na conta.
      operationId: reativar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVideoModeracaoResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: '`VIDEO_NAO_ENCONTRADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '409':
          description: '`VIDEO_NAO_SUSPENSO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
  /api/v1/artesaos/{artesaoSlug}/reputacao:
    get:
      tags:
        - Avaliações
      summary: Média e distribuição das notas recebidas pelo artesão
      operationId: reputacao
      parameters:
        - name: artesaoSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseReputacao'
  /api/v1/artesao/conversas:
    get:
      tags:
        - Conversas
      summary: Conversas dos pedidos do artesão autenticado, com prévia e não lidas
      description: >-
        Somente artesão. Cada conversa traz o código curto do pedido (`codigo`, ex.: `#1A2B3C4D`, também usado em
        `assunto`) e o comprador (`comprador.nome` e `comprador.imagem`, nulos quando o perfil não está disponível;
        `pessoa` cai para "Comprador" e `retrato` repete a imagem).
      operationId: doArtesao
      parameters:
        - name: usuario
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/UsuarioAutenticado'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListConversaArtesaoResponse'
      security:
        - bearer-jwt: []
  /api/v1/eventos:
    get:
      tags:
        - evento-controller
      operationId: listarEventos
      parameters:
        - name: lat
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: lng
          in: query
          required: false
          schema:
            type: number
            format: double
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseListEventoResponse'
    post:
      tags:
        - evento-controller
      summary: Organizador submete um evento para moderação
      description: >-
        Somente organizador. O evento nasce `PENDENTE` e não publicado. Endereço detalhado (`rua`, `numero`, `bairro`
        obrigatórios; `cep`, `complemento`, `referencia` e `site` opcionais) e contato (`contatoNome` e
        `contatoTelefone` obrigatórios, `contatoEmail` opcional) são gravados; o contato só aparece na moderação.
        Idempotente por slug para o mesmo organizador: reenviar um slug já submetido pela mesma conta devolve o evento
        existente (201, sem alterá-lo); o mesmo slug de outro organizador responde 409.
      operationId: criarEvento
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarEventoRequest'
        required: true
      responses:
        '201':
          description: Submetido (ou reenvio do mesmo organizador).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEventoSubmetidoResponse'
        '400':
          description: '`REQUISICAO_INVALIDA`, com as mensagens por campo em `erro.campos`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          description: '`EVENTO_JA_EXISTENTE` — slug em uso por outro organizador.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
  /api/v1/eventos/{slug}:
    get:
      tags:
        - evento-controller
      summary: Detalhe público de um evento aprovado
      operationId: consultarPorSlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEventoResponse'
        '404':
          description: '`RECURSO_NAO_ENCONTRADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
  /api/v1/admin/eventos:
    get:
      tags:
        - Moderação de eventos
      summary: Eventos em moderação por estado, com contato e solicitante
      description: >-
        Somente administrador. `solicitante` vem da conta do organizador no profile-service e fica nulo se ela não
        puder ser consultada.
      operationId: listarEventosEmModeracao
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDENTE
              - APROVADO
              - REJEITADO
            default: PENDENTE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListEventoModeracaoResponse'
        '400':
          description: '`REQUISICAO_INVALIDA` — estado desconhecido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
      security:
        - bearer-jwt: []
  /api/v1/admin/eventos/{slug}:
    get:
      tags:
        - Moderação de eventos
      summary: Detalhe de um evento para moderação, com contato e solicitante
      description: Somente administrador.
      operationId: detalharEventoEmModeracao
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEventoModeracaoResponse'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: '`RECURSO_NAO_ENCONTRADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
  /api/v1/admin/eventos/{slug}/decisao:
    post:
      tags:
        - Moderação de eventos
      summary: Aprova ou rejeita um evento pendente
      description: Somente administrador. Rejeitar exige `motivo` (até 1000 caracteres).
      operationId: decidirEvento
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisaoEventoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseEventoModeracaoResponse'
        '400':
          description: '`REQUISICAO_INVALIDA` — decisão desconhecida ou motivo ausente ao rejeitar.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: '`RECURSO_NAO_ENCONTRADO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '409':
          description: '`EVENTO_JA_DECIDIDO`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
components:
  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NaoAutenticado:
      description: '`NAO_AUTENTICADO` — token ausente, inválido ou expirado (respondido pelo gateway ou pelo serviço).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
    SemPermissao:
      description: '`SEM_PERMISSAO` — o papel da conta não é aceito nesta operação.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
  schemas:
    Criar:
      type: object
      properties:
        pedidoId:
          type: string
        slug:
          type: string
        chave:
          type: string
    Reserva:
