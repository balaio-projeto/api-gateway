  /api/v1/fretes:
    get:
      tags:
        - pedidos-controller
      summary: Cota as opções de entrega, incluindo retirada no ateliê e entrega local
      description: >-
        Público. Sem `cep`, devolve uma opção demonstrativa. Com `cep` e sem `itens`, cota um pacote genérico só com
        transportadoras. Com `itens` (todos do mesmo ateliê), devolve as transportadoras e, ao final, as opções locais
        do ateliê, ambas com `provedor` `balaio_local`: `entrega-local` (modalidade `entrega_local`) quando o artesão
        aceita entrega local e os primeiros dígitos do CEP de destino (padrão 5) coincidem com o CEP de origem; e
        `retirada-atelie` (modalidade `retirada`, R$ 0,00) quando o artesão aceita retirada — o `detalhe` mostra só
        bairro e cidade. Nessas opções o prazo é combinado pela conversa do pedido.
      operationId: fretes
      parameters:
        - name: cep
          in: query
          required: false
          description: CEP de destino.
          schema:
            type: string
          example: 01310-100
        - name: itens
          in: query
          required: false
          description: Até 20 itens no formato `slug:quantidade` (quantidade de 1 a 3), separados por vírgula, sem repetir slug.
          schema:
            type: string
          example: vaso-de-barro:1,colar-de-sementes:2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeListaOpcaoFrete'
        '400':
          description: '`CEP_INVALIDO` ou `REQUISICAO_INVALIDA` (itens fora do formato).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '409':
          description: '`PECA_INDISPONIVEL` ou `ATELIES_DIFERENTES`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '503':
          description: '`FRETE_INDISPONIVEL` ou `CATALOGO_INDISPONIVEL`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
