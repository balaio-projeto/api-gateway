        nome:
          type: string
        url:
          type: string
        ordem:
          type: integer
          format: int32
    PecaItemResponse:
      type: object
      properties:
        dados:
          $ref: '#/components/schemas/PecaResponse'
        erro: {}
    PecaResponse:
      type: object
      properties:
        slug:
          type: string
        nome:
          type: string
        artesao:
          type: string
        territorio:
          type: string
        tecnica:
          type: string
        categoria:
          type: string
        tipo:
          type: string
        preco:
          type: number
        desconto:
          type: number
        disponibilidade:
          type: string
        prazoProducaoDias:
          type: integer
          format: int32
        historia:
          type: array
          items:
