  /api/v1/checkout:
    post:
      tags:
        - pedidos-controller
      summary: Cria o pedido e inicia o pagamento, com cupom opcional
      description: >-
        Comprador ou artesão autenticado (artesão não compra do próprio ateliê). Com `cupom`, vale só aquele código;
        sem `cupom`, entra automaticamente a promoção vigente de maior desconto. Cupons e promoções são custeados pela
        plataforma e não acumulam. O cupom é revalidado dentro da transação; a repetição com a mesma
        `Idempotency-Key` devolve o pedido existente sem consumir outro uso. O total nunca fica abaixo de R$ 1,00.
        `freteId` aceita também `retirada-atelie` e `entrega-local` quando cotados em `GET /api/v1/fretes`.
      operationId: checkout
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 160
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
        required: true
      responses:
        '202':
          description: Pedido criado (ou já existente para a mesma chave), aguardando pagamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePedidoComEndereco'
        '400':
          description: '`REQUISICAO_INVALIDA`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: '`ENDERECO_NAO_ENCONTRADO` — `enderecoId` não encontrado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '409':
          description: >-
            `CHECKOUT_CONFLITANTE`, `PEDIDO_CONFLITANTE` (peças de ateliês diferentes), `PECA_INDISPONIVEL`,
            `FRETE_INDISPONIVEL` ou `RESERVA_CONFLITANTE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '422':
          description: >-
            `PECA_DO_PROPRIO_ATELIE`, `ENDERECO_INCOMPLETO` ou recusa de cupom: `CUPOM_INVALIDO`, `CUPOM_INATIVO`,
            `CUPOM_AINDA_NAO_VALIDO`, `CUPOM_EXPIRADO`, `CUPOM_ESGOTADO`, `CUPOM_LIMITE_COMPRADOR`,
            `CUPOM_PEDIDO_MINIMO`, `CUPOM_SEM_DESCONTO` ou `PROMOCAO_ENCERRADA`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '503':
          description: '`CATALOGO_INDISPONIVEL`, `PERFIL_INDISPONIVEL` ou `PAGAMENTO_INDISPONIVEL`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
  /api/v1/checkout/cupom:
    post:
      tags:
        - pedidos-controller
      summary: Prévia do desconto de um cupom (ou da melhor promoção automática) para os itens do checkout
      description: >-
        Comprador ou artesão autenticado. Não reserva nem consome o cupom. Sem `cupom`, devolve a melhor promoção
        automática aplicável ou `dados: null` quando não há nenhuma. `frete` (0 a 10000) é o valor da entrega
        escolhida; se ausente, cupons de frete grátis são aceitos sem calcular desconto de frete. Até 20 itens.
      operationId: simularCupom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulacaoCupomRequest'
        required: true
      responses:
        '200':
          description: Prévia do desconto, ou `dados` nulo quando não há promoção automática aplicável.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePreviaCupom'
        '400':
          description: '`REQUISICAO_INVALIDA` — itens ausentes, mais de 20 itens, item inválido ou frete fora da faixa.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '409':
          description: '`PECA_INDISPONIVEL` ou `PEDIDO_CONFLITANTE` (peças de ateliês diferentes).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '422':
          description: >-
            `PECA_DO_PROPRIO_ATELIE` ou recusa de cupom: `CUPOM_INVALIDO`, `CUPOM_INATIVO`, `CUPOM_AINDA_NAO_VALIDO`,
            `CUPOM_EXPIRADO`, `CUPOM_ESGOTADO`, `CUPOM_LIMITE_COMPRADOR`, `CUPOM_PEDIDO_MINIMO` ou `CUPOM_SEM_DESCONTO`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '503':
          description: '`CATALOGO_INDISPONIVEL`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
