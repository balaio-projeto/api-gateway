openapi: 3.1.0
info:
  title: Balaio api-gateway
  version: v1
  description: >-
    Rotas públicas do gateway. Gerado a partir das especificações dos serviços (catalog, profile, commerce, community e
    events), filtrado pelas rotas de application.yaml. As regras de acesso (público, autenticado, artesão,
    administrador) estão em GatewayAccessPolicy. As operações revisadas em 25/11/2026 (notificações, cupons,
    frete local, vendas do artesão, moderação de vídeos e de eventos, contas e curadoria administrativas, endereços e
    busca do catálogo) trazem o papel exigido na descrição e em `security`; nas demais isso ainda não está refletido por
    operação. Erros seguem o envelope `{ "dados": null, "erro": { "codigo", "mensagem" } }`; o gateway responde 401
    `NAO_AUTENTICADO` sem token válido e 403 `SEM_PERMISSAO` quando o papel não é aceito.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
paths:
  /api/v1/pecas:
    get:
      tags:
        - Catálogo
      summary: Listar peças publicadas
      description: >-
        Público. A busca textual `q` ignora acentos e maiúsculas e exige que a peça case com todas as palavras
        relevantes informadas (até 8; artigos e preposições como "de", "da", "com" e "para" são descartados quando há
        outras palavras). Cada palavra casa com o texto da peça (nome, slug do artesão, território, técnica, categoria,
        tipo e história) no singular ou no plural ("vasos" encontra "vaso", "colares" encontra "colar", "potes"
        encontra "pote") ou com o nome ou o ateliê de um artesão público: nesse caso entram todas as peças daquele
        artesão. A lista de artesãos é consultada no profile-service com cache de 30 segundos; se o profile estiver
        indisponível, a busca continua só pelo texto das peças.
      operationId: listar
      parameters:
        - name: q
          in: query
          required: false
          description: Termos de busca; todas as palavras precisam casar (ver descrição da operação).
          schema:
            type: string
          example: vasos de barro maria
        - name: tecnica
          in: query
          required: false
          schema:
            type: string
        - name: territorio
          in: query
          required: false
          schema:
            type: string
        - name: categoria
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
        - name: disponibilidade
          in: query
          required: false
          schema:
            type: string
        - name: desconto
          in: query
          required: false
          schema:
            type: boolean
        - name: precoMin
          in: query
          required: false
          schema:
            type: number
        - name: precoMax
          in: query
          required: false
          schema:
            type: number
        - name: ordenar
          in: query
          required: false
          schema:
            type: string
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: tamanho
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecasListResponse'
    post:
      tags:
        - Catálogo
      operationId: criar_1
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosPeca'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecaItemResponse'
  /api/v1/pecas/{slug}:
    get:
      tags:
        - Catálogo
      operationId: obter
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecaItemResponse'
    delete:
      tags:
        - Catálogo
      operationId: inativar
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    patch:
      tags:
        - Catálogo
      operationId: atualizar
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosPeca'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecaItemResponse'
  /api/v1/referencias:
    get:
      tags:
        - referencias-controller
      summary: Consultar referências curadas e persistidas no catálogo
      operationId: consultar_1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Resposta'
  /api/v1/pecas/{slug}/relacionadas:
    get:
      tags:
        - Catálogo
      summary: Listar peças públicas da mesma técnica, excluindo a peça atual
      operationId: relacionadas
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: limite
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecasRelacionadasResponse'
  /api/v1/pecas/{slug}/historico:
    get:
      tags:
        - Catálogo
      summary: Consultar dados históricos da peça, inclusive após inativação
      operationId: historico
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecaItemResponse'
  /api/v1/artesaos/{slug}/pecas:
    get:
      tags:
        - artesao-pecas-controller
      operationId: listarPublicas
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecasListResponse'
  /api/v1/arquivos/pecas/{nome}:
    get:
      tags:
        - arquivos-peca-controller
      operationId: obter_1
      parameters:
        - name: nome
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/v1/artesao/me/imagem:
    put:
      tags:
        - perfil-artesao-controller
      operationId: enviarImagem
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                arquivo:
                  type: string
                  format: binary
              required:
                - arquivo
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaPerfilArtesaoResponse'
    delete:
      tags:
        - perfil-artesao-controller
      operationId: removerImagem
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaPerfilArtesaoResponse'
  /api/v1/usuario/enderecos:
    get:
      tags:
        - enderecos-comprador-controller
      summary: Endereços de entrega da conta autenticada (principal primeiro)
      description: Autenticado, papel comprador ou artesão (artesão também compra). Outros papéis recebem 403.
      operationId: listar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaListEndereco'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
      security:
        - bearer-jwt: []
    post:
      tags:
        - enderecos-comprador-controller
      summary: Cadastra endereço de entrega; o primeiro vira o principal
      description: Autenticado, papel comprador ou artesão.
      operationId: criar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaEndereco'
        '400':
          description: '`REQUISICAO_INVALIDA` — campo ausente, longo demais, CEP inválido ou bairro sem cidade e UF.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
      security:
        - bearer-jwt: []
  /api/v1/coletivos:
    get:
      tags:
        - coletivos-controller
      operationId: listar_1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaListColetivo'
    post:
      tags:
        - coletivos-controller
      operationId: criar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoColetivo'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaColetivo'
  /api/v1/auth/redefinicao:
    post:
      tags:
        - recovery-controller
      operationId: reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reset'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseResetReceipt'
  /api/v1/auth/recuperacao:
    post:
      tags:
        - recovery-controller
      operationId: request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiResponseReceipt'
  /api/v1/auth/logout:
    post:
      tags:
        - autenticacao-controller
      operationId: sair
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaSessaoEncerrada'
  /api/v1/auth/login:
    post:
      tags:
        - autenticacao-controller
      operationId: entrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequisicao'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaUsuarioPublicoResposta'
  /api/v1/auth/entrar:
    post:
      tags:
        - autenticacao-controller
      operationId: entrar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequisicao'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaUsuarioPublicoResposta'
  /api/v1/auth/cadastro:
    post:
      tags:
        - cadastro-publico-controller
      operationId: cadastrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroPublicoRequisicao'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaUsuarioPublicoResposta'
  /api/v1/auth/alterar-senha:
    post:
      tags:
        - autenticacao-controller
      operationId: alterarSenha
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequisicao'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaSenhaAlteradaResposta'
  /api/v1/artesao/selo:
    get:
      tags:
        - curadoria-controller
      operationId: consultar
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaEstado'
    post:
      tags:
        - curadoria-controller
      operationId: solicitar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaEstado'
  /api/v1/artesao/me:
    get:
      tags:
        - perfil-artesao-controller
      operationId: meu
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaPerfilArtesaoResponse'
    post:
      tags:
        - perfil-artesao-controller
      operationId: criar_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilArtesaoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaPerfilArtesaoResponse'
    patch:
      tags:
        - perfil-artesao-controller
      operationId: atualizarMeu
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaPerfilArtesaoResponse'
  /api/v1/admin/curadoria/{id}/decisao:
    post:
      tags:
        - curadoria-controller
      operationId: decidir
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaSolicitacao'
  /api/v1/usuario/enderecos/{id}:
    get:
      tags:
        - enderecos-comprador-controller
      operationId: consultar_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaEndereco'
    delete:
      tags:
        - enderecos-comprador-controller
      operationId: excluir
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaEndereco'
    patch:
      tags:
        - enderecos-comprador-controller
      summary: Atualiza parcialmente um endereço próprio
      description: >-
        Autenticado, papel comprador ou artesão. Campos ausentes mantêm o valor atual; `numero` e `complemento`
        enviados como null ou em branco são apagados. `principal: true` torna este o endereço principal.
      operationId: atualizar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoAtualizacaoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaEndereco'
        '400':
          description: '`REQUISICAO_INVALIDA`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: '`RECURSO_NAO_ENCONTRADO` — o endereço não existe ou é de outra conta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
  /api/v1/usuario:
    get:
      tags:
        - usuario-atual-controller
      operationId: consultar_2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaUsuarioPublicoResposta'
    patch:
      tags:
        - preferencias-controller
      operationId: atualizarConta
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaUsuarioPublicoResposta'
  /api/v1/conta/{id}:
    patch:
      tags:
        - preferencias-controller
      operationId: atualizarConta_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaUsuarioPublicoResposta'
  /api/v1/artesaos/{slug}:
    get:
      tags:
        - perfil-artesao-controller
      operationId: publico
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaPerfilArtesaoResponse'
    patch:
      tags:
        - perfil-artesao-controller
      operationId: atualizar_1
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaPerfilArtesaoResponse'
  /api/v1/artesaos/{slug}/configuracoes:
    get:
      tags:
        - preferencias-controller
      operationId: consultar_3
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaConfiguracoes'
    patch:
      tags:
        - preferencias-controller
      summary: Atualiza parcialmente as configurações do ateliê, inclusive retirada e entrega local
      description: >-
        Somente o artesão dono do ateliê. Campos ausentes mantêm o valor atual; campos desconhecidos são recusados.
        Com `aceitaRetirada: true`, `retiradaBairro` e `retiradaCidade` são obrigatórios (até 80 caracteres cada, sem
        o endereço completo — o endereço exato é combinado pela conversa do pedido). Com `aceitaEntregaLocal: true`,
        `cepOrigem` é obrigatório. Essas opções alimentam `retirada-atelie` e `entrega-local` em `GET /api/v1/fretes`.
      operationId: atualizar_2
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguracoesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaConfiguracoes'
        '400':
          description: '`REQUISICAO_INVALIDA`, com o campo problemático em `erro.campos`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: '`RECURSO_NAO_ENCONTRADO` — perfil inexistente.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
  /api/v1/arquivos/perfis/{midiaId}:
    get:
      tags:
        - midia-perfil-controller
      operationId: recuperar
      parameters:
        - name: midiaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
    head:
      tags:
        - midia-perfil-controller
      operationId: consultar_4
      parameters:
        - name: midiaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/coletivos/{slug}:
    get:
      tags:
        - coletivos-controller
      operationId: consultar_5
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaColetivo'
  /api/v1/artesaos:
    get:
      tags:
        - perfil-artesao-controller
      operationId: listar_2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroPublicoRespostaListPerfilArtesaoResponse'
  /api/v1/admin/curadoria:
    get:
      tags:
        - curadoria-controller
      summary: Fila de solicitações do selo, filtrada e paginada
      description: >-
        Somente administrador. Ordena as decididas mais recentes depois das ainda não decididas (decidido_em desc,
        nulos primeiro) e, em seguida, por data de solicitação. `pecasPublicadas` só é calculado para solicitações
        pendentes (consulta o catálogo). A página é ajustada para o intervalo existente.
      operationId: fila
      parameters:
        - name: situacao
          in: query
          required: false
          schema:
            type: string
            enum:
              - pendente
              - ajuste
              - aprovada
              - todas
            default: pendente
        - name: busca
          in: query
          required: false
          description: Trecho do nome do artesão ou do ateliê (sem diferenciar maiúsculas), até 100 caracteres.
          schema:
            type: string
            maxLength: 100
        - name: pagina
          in: query
          required: false
          description: Página a partir de 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: tamanho
          in: query
          required: false
          description: Itens por página; valores menores que 1 usam o padrão e o máximo é 50.
          schema:
            type: integer
            format: int32
            default: 10
            maximum: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaPaginadaSolicitacao'
        '400':
          description: '`REQUISICAO_INVALIDA` — `situacao` desconhecida ou `busca` longa demais (em `erro.campos`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '503':
          description: '`CATALOGO_INDISPONIVEL` ou `SERVICO_INDISPONIVEL`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
  /api/v1/admin/contas:
    get:
      tags:
        - organizador-admin-controller
      summary: Lista contas administráveis (paginado) ou busca uma conta pelo e-mail
      description: >-
        Somente administrador. Sem `email`, entra no modo listagem: devolve contas de comprador e organizador (nunca
        administradores ou artesãos), organizadores primeiro e depois por nome, com `paginacao`. Com `email`, entra no
        modo busca exata: devolve uma única conta de qualquer papel, sem `paginacao`, e os demais parâmetros são
        ignorados.
      operationId: buscarOuListar
      parameters:
        - name: email
          in: query
          required: false
          description: Modo busca por e-mail exato.
          schema:
            type: string
            format: email
        - name: busca
          in: query
          required: false
          description: Modo listagem. Trecho do nome ou do e-mail, até 100 caracteres.
          schema:
            type: string
            maxLength: 100
        - name: papel
          in: query
          required: false
          description: Modo listagem. `todos` traz comprador e organizador.
          schema:
            type: string
            enum:
              - todos
              - comprador
              - organizador
            default: todos
        - name: pagina
          in: query
          required: false
          description: Modo listagem. Página a partir de 1.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: tamanho
          in: query
          required: false
          description: Modo listagem. Itens por página, máximo 50.
          schema:
            type: integer
            format: int32
            default: 10
            maximum: 50
      responses:
        '200':
          description: Listagem paginada (sem `email`) ou conta encontrada (com `email`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RespostaPaginadaContaAdmin'
                  - $ref: '#/components/schemas/CadastroPublicoRespostaContaAdmin'
        '400':
          description: '`EMAIL_INVALIDO` (modo e-mail) ou `REQUISICAO_INVALIDA` (filtro `papel` ou `busca` inválido).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: '`CONTA_NAO_ENCONTRADA` — nenhuma conta com o e-mail informado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '500':
          description: '`CONSULTA_CONTA_INDISPONIVEL`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
      security:
        - bearer-jwt: []
