    CupomRequest:
      type: object
      description: >-
        Sem `codigo`, o cadastro é uma promoção automática. Em `frete_gratis` o `valor` é ignorado e o desconto é o
        frete, limitado a `descontoMaximo`.
      properties:
        codigo:
          type:
            - string
            - 'null'
          pattern: ^[A-Z0-9][A-Z0-9_-]{2,39}$
          description: 3 a 40 letras sem acento, números, hífen ou sublinhado; normalizado para maiúsculas.
        descricao:
          type: string
          minLength: 3
          maxLength: 200
        tipo:
          type: string
          enum:
            - percentual
            - valor_fixo
            - frete_gratis
        valor:
          type: number
          description: Percentual (maior que 0 e até 100) ou valor em reais; até 2 casas decimais.
        descontoMaximo:
          type:
            - number
            - 'null'
          description: Teto do desconto em reais (opcional).
        pedidoMinimo:
          type: number
          minimum: 0
          default: 0
          description: Mínimo do subtotal das peças.
        inicio:
          type:
            - string
            - 'null'
          format: date-time
        fim:
          type:
            - string
            - 'null'
          format: date-time
          description: Precisa ser depois de `inicio`.
        limiteUsos:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          description: Nulo é ilimitado.
        limitePorComprador:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
        ativo:
          type: boolean
          default: true
      required:
        - descricao
        - tipo
    CupomResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type:
            - string
            - 'null'
        automatico:
          type: boolean
          description: Verdadeiro para promoção automática (sem código).
        descricao:
          type: string
        tipo:
          type: string
          enum:
            - percentual
            - valor_fixo
            - frete_gratis
        valor:
          type: number
        descontoMaximo:
          type:
            - number
            - 'null'
        pedidoMinimo:
          type: number
        inicio:
          type:
            - string
            - 'null'
          format: date-time
        fim:
          type:
            - string
            - 'null'
          format: date-time
        limiteUsos:
          type:
            - integer
            - 'null'
          format: int32
        limitePorComprador:
          type:
            - integer
            - 'null'
          format: int32
        usos:
          type: integer
          format: int32
        ativo:
          type: boolean
        situacao:
          type: string
          enum:
            - ativo
            - agendado
            - expirado
            - esgotado
            - inativo
        custeadoPor:
          type: string
          enum:
            - plataforma
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    EnvelopeCupom:
      type: object
      properties:
        dados:
          $ref: '#/components/schemas/CupomResponse'
        erro:
          type: 'null'
    EnvelopeListaCupom:
