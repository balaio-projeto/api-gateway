      properties:
        id:
          type: string
          format: uuid
        pedidoId:
          type: string
        slug:
          type: string
        estado:
          type: string
        expiraEm:
          type: string
          format: date-time
        preco:
          type: number
        artesao:
          type: string
        proprietarioId:
          type: string
          format: uuid
    Resposta:
      type: object
      properties:
        dados:
          $ref: '#/components/schemas/Reserva'
        erro: {}
    Liberar:
      type: object
      properties:
        pedidoId:
          type: string
        chave:
          type: string
    Confirmar:
      type: object
      properties:
        pedidoId:
          type: string
        chave:
          type: string
    DadosPeca:
      type: object
      properties:
        nome:
          type: string
        tecnica:
          type: string
        territorio:
          type: string
        categoria:
          type: string
        tipo:
          type: string
        historia:
          type: array
          items:
            type: string
        materiais:
          type: array
          items:
            type: string
        preco:
          type: number
        disponibilidade:
          type: string
        prazoProducaoDias:
