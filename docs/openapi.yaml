openapi: 3.1.0
info:
  title: Balaio api-gateway
  version: v1
  description: >-
    Rotas públicas do gateway. Gerado a partir das especificações dos serviços (catalog, profile, commerce, community e
    events), filtrado pelas rotas de application.yaml. As regras de acesso (público, autenticado, artesão,
    administrador) estão em GatewayAccessPolicy e não estão refletidas por operação nesta especificação.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
paths:
  /api/v1/pecas:
    get:
      tags:
        - Catálogo
      summary: Listar peças publicadas
      operationId: listar
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: tecnica
          in: query
          required: false
          schema:
            type: string
        - name: territorio
          in: query
          required: false
          schema:
            type: string
        - name: categoria
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
        - name: disponibilidade
          in: query
          required: false
          schema:
            type: string
        - name: desconto
          in: query
          required: false
          schema:
            type: boolean
        - name: ordenar
          in: query
          required: false
          schema:
            type: string
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: tamanho
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecasListResponse'
    post:
      tags:
        - Catálogo
      operationId: criar_1
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DadosPeca'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PecaItemResponse'
  /api/v1/pecas/{slug}:
    get:
      tags:
