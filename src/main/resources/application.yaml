server:
  port: ${GATEWAY_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog-list
              uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/pecas
                - Method=GET
management:
  endpoints:
    web:
      exposure:
        include: health,info